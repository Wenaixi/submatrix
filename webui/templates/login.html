<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SubMatrix · 系统登录</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon/favicon.svg" />
  <link rel="stylesheet" href="/static/dist/app.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-1);
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      background: var(--surface-0);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" fill="#000000" />
        <path d="M25 25 H75 M25 50 H75 M25 75 H75 M25 25 V75 M50 25 V75 M75 25 V75" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square"/>
        <rect x="17" y="17" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="42" y="17" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="67" y="17" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="17" y="42" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="42" y="42" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="67" y="42" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="17" y="67" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="42" y="67" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="67" y="67" width="16" height="16" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
      </svg>
      <div>
        <h2 style="font-size: 18px; font-weight: 500; color: var(--text-primary); margin: 0;">SubMatrix</h2>
        <div style="font-size: 11px; color: var(--text-secondary);">系统访问认证</div>
      </div>
    </div>

    <div>
      <label style="font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px;">API 访问密钥 (API Key)</label>
      <input id="apiKeyInput" type="password" placeholder="请输入 API Key 凭证..." />
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px;">
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
        <input id="rememberKey" type="checkbox" checked /> 记住凭证
      </label>
      <button type="button" id="show-apikey" class="btn-ghost" style="padding: 2px 6px; font-size: 11px;">显示明文</button>
    </div>

    <button id="login-button" class="btn-primary" style="width: 100%; padding: 8px;">进入控制台</button>
    <div id="loginError" style="color: #ef4444; font-size: 12px; text-align: center; display: none;"></div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
